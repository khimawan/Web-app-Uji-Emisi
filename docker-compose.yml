services:
  postgres:
    image: postgres:14-alpine
    container_name: uji-emisi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uji_emisi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uji-emisi-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: uji_emisi
      JWT_SECRET: devin-secret-key-2024
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uji-emisi-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: uji-emisi-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run --token-file /etc/cloudflared/tunnel.token
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - /root/.cloudflared/tunnel.token:/etc/cloudflared/tunnel.token:ro
    depends_on:
      - frontend

volumes:
  postgres_data:
